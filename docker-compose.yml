services:
  webapp:
    build: .
    container_name: loan-default-streamlit
    ports:
      - "8501:8501"
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0

  inference-api:
    build: .
    container_name: loan-default-inference-api
    ports:
      - "8000:8000"
    entrypoint: []
    command: uvicorn src.inference.api:app --host 0.0.0.0 --port 8000